const KEY='spb_fish_pokedex_v1';let state={};try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const groups=[...new Set(fish.map(x=>x.group).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ru'));const g=document.getElementById('group');groups.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;g.appendChild(o)});
const search=document.getElementById('search'), status=document.getElementById('status'), list=document.getElementById('list');
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateStats()}
function updateStats(){let n=fish.filter(x=>state[x.id]).length;let p=Math.round(n/fish.length*100);document.getElementById('count').textContent=n+' / '+fish.length+' поймано';document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%'}
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function render(){let q=search.value.trim().toLowerCase(), gr=g.value, st=status.value;let arr=fish.filter(x=>(!q||[x.name,x.latin,x.group,x.where].join(' ').toLowerCase().includes(q))&&(!gr||x.group===gr)&&(!st||x.status===st));if(!arr.length){list.innerHTML='<div class="empty">Ничего не найдено</div>';return}list.innerHTML=arr.map(x=>{let done=!!state[x.id];return `<article class="card ${done?'done':''}"><div class="head"><input class="check" type="checkbox" ${done?'checked':''} aria-label="Поймал ${esc(x.name)}" data-id="${x.id}"><img class="thumb" src="${esc(x.img)}" loading="lazy" onerror="this.style.visibility='hidden'"><div><div class="title">${esc(x.name)}</div><div class="latin">${esc(x.latin)}</div><div class="tag">${esc(x.group)}</div></div></div><div class="details"><div><b>Где:</b> ${esc(x.where)}</div><div><b>Статус:</b> ${esc(x.status)}</div><div><b>Правовой статус:</b> ${esc(x.legal)}</div>${x.date?`<div><b>Дата:</b> ${esc(x.date)}</div>`:''}${x.place?`<div><b>Место:</b> ${esc(x.place)}</div>`:''}${x.tackle?`<div><b>Снасть:</b> ${esc(x.tackle)}</div>`:''}${x.size?`<div><b>Размер:</b> ${esc(x.size)} см</div>`:''}${x.weight?`<div><b>Вес:</b> ${esc(x.weight)} г</div>`:''}${x.comment?`<div><b>Комментарий:</b> ${esc(x.comment)}</div>`:''}<img class="photoBig" src="${esc(x.img)}" loading="lazy" onerror="this.style.display='none'">${x.userPhoto?`<div class="small" style="margin-top:8px">📸 Твой трофей</div><img class="myphoto" src="${x.userPhoto}">`:''}<div class="source" style="margin-top:8px">Фото: Wikimedia Commons</div></div></article>`}).join('');document.querySelectorAll('.check').forEach(c=>c.addEventListener('change',e=>{state[e.target.dataset.id]=e.target.checked;save();render()}));updateStats()}
search.addEventListener('input',render);g.addEventListener('change',render);status.addEventListener('change',render);render();
</script></body></html>
